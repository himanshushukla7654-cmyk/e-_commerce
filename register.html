<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MyStore</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }


        .container {
            width: 90%;

            max-width: 450px;

            margin: 60px auto;
        }


        .box {
            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.1);
        }


        h1 {
            text-align: center;

            margin-bottom: 25px;
        }


        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }


        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }


        button {
            width: 100%;

            padding: 13px;

            background: #111;

            color: white;

            border: none;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;
        }


        .error {
            background: #ffe5e5;

            color: red;

            padding: 10px;

            margin-bottom: 20px;

            border-radius: 5px;
        }


        .link {
            text-align: center;

            margin-top: 20px;
        }


        .link a {
            color: #111;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="container">

        <div class="box">

            <h1>
                Create Account
            </h1>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <div class="link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </div>

    </div>


</body>

</html>
