{% extends "base.html" %}

{% block title %}Login - Himanshu Store{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper{
    min-height:65vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.auth-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}
.auth-box h1{
    text-align:center;
    margin-bottom:8px;
}
.auth-box .subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}
.auth-box label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}
.auth-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}
.auth-box button{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}
.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
}
.signup-link{
    text-align:center;
    margin-top:20px;
}
.signup-link a{
    color:#2563eb;
    font-weight:bold;
}
</style>
{% endblock %}

{% block content %}

<div class="container auth-wrapper">

    <div class="auth-box">

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Login to Himanshu Store
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </div>

    </div>

</div>

{% endblock %}
